name: Morning Claude Session
on:
  schedule:
    - cron: '0 7 * * *' # 7am UTC 
  workflow_dispatch:
  
jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: .github/workflows/morning/requirements.txt
      - name: Install dependencies
        run: pip install -r .github/workflows/morning/requirements.txt
      - name: Send morning message
        run: python .github/workflows/morning/script.py
        env:
          CLAUDE_REFRESH_TOKEN: ${{ secrets.CLAUDE_REFRESH_TOKEN }}
